<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="100%" height="100%">
  <!-- Estilo del trazo -->
  <g stroke="#34424D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- M estilizada con símbolo < -->
    <path d="M 25 55 L 15 40 L 25 25" stroke="#7B8B6F" stroke-width="3.5" /> <!-- Bracket < en verde oliva -->
    <path d="M 32 55 L 32 25 L 47 45 L 62 25 L 62 55" />
    
    <!-- Separador diagonal / -->
    <line x1="75" y1="55" x2="85" y2="25" stroke="#7B8B6F" stroke-width="2.5" />

    <!-- A minimalista sin barra transversal -->
    <path d="M 98 55 L 113 25 L 128 55" />
    
    <!-- C geométrica limpia -->
    <path d="M 165 30 C 150 20, 138 32, 138 40 C 138 48, 150 60, 165 50" />
    
  </g>
</svg>
